# WorkflowHub version of the stack. build_zip.py copies this to the root of the upload zip.
#
# WorkflowHub rebuilds this file and keeps only: build/image, command, entrypoint, environment
# (+ env_file), ports, depends_on, healthcheck, restart and named volumes. So:
#   - only the container port is listed (the platform picks the host port),
#   - services find each other by name (web -> api:8000, api -> db:5432),
#   - settings and the DB password come from .env (generated by build_zip.py, kept out of git).

services:
  web:   # the front door: the Open button goes to the service called web/frontend/ui
    build: ./frontend
    restart: unless-stopped
    ports: ["8080"]
    # Started without waiting for the API: nginx resolves `api` per request, so the page
    # answers the platform's 30-second smoke test even while migrations are still running.
    depends_on: [api]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ""  # UI and API share one origin behind nginx
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 12

  db:   # no ports: only the api reaches it
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docformatter -d docformatter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
