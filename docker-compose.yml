# Production stack: PostgreSQL + API + web (nginx). Configure via .env (see .env.example).
#   docker compose up -d --build
name: docformatter

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docformatter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: docformatter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docformatter -d docformatter"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    # Not published: only reachable by the api service on the internal network.

  api:
    build: ./backend
    image: docformatter-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://docformatter:${POSTGRES_PASSWORD}@db:5432/docformatter
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.0.84:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ""  # UI and API share an origin behind nginx
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging

  web:
    build: ./frontend
    image: docformatter-web:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
